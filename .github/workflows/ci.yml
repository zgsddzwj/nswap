name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations:
    # 空库全链迁移守卫（docs/12 P0-1 防回归）：测试走 create_all 不经过 alembic，
    # 迁移链断裂只有这里能拦住
    name: 数据库迁移链（空库升级）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nswap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: MySQL 空库全链升级（生产路径，拦重复索引/方言不兼容）
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/nswap?charset=utf8mb4
        run: alembic upgrade head
      - name: SQLite 空库全链升级（开发路径，拦 ALTER 约束类不兼容）
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./mig_ci.db
        run: alembic upgrade head

  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: pytest
        working-directory: backend
        env:
          ENV: dev
          DATABASE_URL: sqlite:///./test_ci.db
          WX_CALL_MODE: mock
          ENABLE_SCHEDULER: "false"
        run: python -m pytest tests/ -q

  admin-web:
    name: 管理后台构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖（npmmirror）
        working-directory: admin-web
        run: npm ci --registry=https://registry.npmmirror.com
      - name: 类型检查 + 构建
        working-directory: admin-web
        run: npm run build

  miniprogram:
    name: 小程序类型与结构校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖（npmmirror）
        working-directory: miniprogram
        run: npm ci --registry=https://registry.npmmirror.com
      - name: 构建 TDesign（miniprogram_npm）
        working-directory: miniprogram
        run: npm run build:td
      - name: 类型检查
        working-directory: miniprogram
        run: npx tsc --noEmit
      - name: 结构校验（页面/组件/图标一致性）
        working-directory: miniprogram
        run: node scripts/validate.mjs
