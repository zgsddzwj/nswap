name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: pytest
        working-directory: backend
        env:
          ENV: dev
          DATABASE_URL: sqlite:///./test_ci.db
          WX_CALL_MODE: mock
          ENABLE_SCHEDULER: "false"
        run: python -m pytest tests/ -q

  admin-web:
    name: 管理后台构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖（npmmirror）
        working-directory: admin-web
        run: npm ci --registry=https://registry.npmmirror.com
      - name: 类型检查 + 构建
        working-directory: admin-web
        run: npm run build

  miniprogram:
    name: 小程序类型与结构校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖（npmmirror）
        working-directory: miniprogram
        run: npm ci --registry=https://registry.npmmirror.com
      - name: 构建 TDesign（miniprogram_npm）
        working-directory: miniprogram
        run: npm run build:td
      - name: 类型检查
        working-directory: miniprogram
        run: npx tsc --noEmit
      - name: 结构校验（页面/组件/图标一致性）
        working-directory: miniprogram
        run: node scripts/validate.mjs
