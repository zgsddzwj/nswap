<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - nswap 管理后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh">
  <div class="container" style="max-width:360px">
    <h4 class="text-center mb-4">nswap 管理后台</h4>
    {% if msg %}<div class="alert alert-danger py-2">{{ msg }}</div>{% endif %}
    <form method="post" action="/admin/login" class="card card-body shadow-sm">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input name="password" type="password" class="form-control" required>
      </div>
      <button class="btn btn-dark w-100">登录</button>
    </form>
    <p class="text-center text-muted small mt-3">默认账号 admin / nswap123，上线后请立即修改</p>
  </div>
</body>
</html>
