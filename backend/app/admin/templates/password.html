{% extends "base.html" %}
{% set active = "password" %}
{% block content %}
<h5 class="mb-3">修改密码</h5>
<div class="card" style="max-width:420px"><div class="card-body">
  <form method="post" action="/admin/password">
    <div class="mb-2">
      <label class="form-label small mb-1">旧密码</label>
      <input name="old_password" type="password" class="form-control form-control-sm" required>
    </div>
    <div class="mb-3">
      <label class="form-label small mb-1">新密码（至少 8 位）</label>
      <input name="new_password" type="password" class="form-control form-control-sm" required minlength="8">
    </div>
    <button class="btn btn-sm btn-dark">保存</button>
  </form>
</div></div>
{% endblock %}
